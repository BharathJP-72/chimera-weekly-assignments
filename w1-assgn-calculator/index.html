<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="calculator">
        
        <!-- <h1>Calculator</h1> -->
        <div class="screen">
            <p id="display"></p>
        </div>

        <div>
            <div class="operators-x">
                <!-- <button class="operators" value="+">+</button>
                <button class="operators" value="-">-</button>
                <button class="operators" value="*">x</button>
                <button class="operators" value="/">/</button> -->
            </div>
           <div class="nums">
                 <button class="operators" value="(">(</button>
        <button class="operators" value=")">)</button>
        <button class="operators" value="%">%</button>
        <button class="operators" value="^">^</button>

        <!-- Row 2 -->
        <button class="number" value="7">7</button>
        <button class="number" value="8">8</button>
        <button class="number" value="9">9</button>
        <button class="operators" value="/">/</button>

        <!-- Row 3 -->
        <button class="number" value="4">4</button>
        <button class="number" value="5">5</button>
        <button class="number" value="6">6</button>
        <button class="operators" value="*">×</button>

        <!-- Row 4 -->
        <button class="number" value="1">1</button>
        <button class="number" value="2">2</button>
        <button class="number" value="3">3</button>
        <button class="operators" value="-">-</button>

        <!-- Row 5 -->
        <button class="number" value="0">0</button>
        <button class="number" value=".">.</button>
        <button class="operator" id="calculate">=</button>
        <button class="operators" value="+">+</button>

        <!-- Row 6 -->
        <button class="operators" id="backspace">⌫</button>
        <button class="operators" id="all-clear">AC</button>
           </div>
        </div>
    </div>
    
    
    
    <script src="./script.js"></script>

</body>
</html>
